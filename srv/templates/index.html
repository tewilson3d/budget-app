<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SpendSnap</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ===== ENTRY SCREEN ===== -->
  <div class="screen active" id="screen-entry">
    <header class="top-bar">
      <div class="top-date" id="top-date"></div>
      <button class="link-btn" id="btn-budgets" aria-label="Budgets">Budgets ›</button>
    </header>

    <div class="food-reminder" id="food-reminder">
      <div class="fr-bar"><div class="fr-fill" id="fr-fill"></div></div>
      <div class="fr-text" id="fr-text">Food today: —</div>
    </div>

    <div class="amount-display">
      <span class="currency">฿</span><span id="amount-value" class="amount-num">0</span>
    </div>

    <div class="categories" id="categories"></div>

    <div class="numpad">
      <button class="num-key" data-key="1">1</button>
      <button class="num-key" data-key="2">2</button>
      <button class="num-key" data-key="3">3</button>
      <button class="num-key" data-key="4">4</button>
      <button class="num-key" data-key="5">5</button>
      <button class="num-key" data-key="6">6</button>
      <button class="num-key" data-key="7">7</button>
      <button class="num-key" data-key="8">8</button>
      <button class="num-key" data-key="9">9</button>
      <button class="num-key dot-key" data-key=".">.</button>
      <button class="num-key" data-key="0">0</button>
      <button class="num-key del-key" data-key="del">⌫</button>
    </div>
  </div>

  <!-- ===== BUDGET / OVERVIEW SCREEN ===== -->
  <div class="screen" id="screen-budget">
    <header class="top-bar">
      <button class="icon-btn" id="btn-back" aria-label="Back">‹</button>
      <div class="month-nav">
        <button class="month-arrow" id="month-prev">‹</button>
        <span id="month-label" class="month-label"></span>
        <button class="month-arrow" id="month-next">›</button>
      </div>
      <button class="icon-btn" id="btn-push" aria-label="Push to Sheets">☁︎</button>
    </header>

    <div class="month-total" id="month-total">Spent this month: —</div>

    <div class="budget-cards" id="budget-cards"></div>

    <div class="txn-list" id="txn-list"></div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast"></div>

  <script src="/static/script.js"></script>
</body>
</html>
