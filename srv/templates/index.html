<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SpendSnap</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ===== MAIN SCREEN: Quick Entry ===== -->
  <div class="screen active" id="screen-entry">
    <header class="top-bar">
      <button class="icon-btn" id="btn-history" aria-label="History">📋</button>
      <div class="top-date" id="top-date"></div>
      <button class="icon-btn" id="btn-today-total" aria-label="Today total">
        <span id="today-total-badge">$0</span>
      </button>
    </header>

    <div class="amount-display">
      <span class="currency">$</span><span id="amount-value" class="amount-num">0</span>
    </div>

    <div class="note-row">
      <input type="text" id="note-input" class="note-input" placeholder="Add a note (optional)" maxlength="100">
    </div>

    <div class="categories" id="categories"></div>

    <div class="numpad">
      <button class="num-key" data-key="1">1</button>
      <button class="num-key" data-key="2">2</button>
      <button class="num-key" data-key="3">3</button>
      <button class="num-key" data-key="4">4</button>
      <button class="num-key" data-key="5">5</button>
      <button class="num-key" data-key="6">6</button>
      <button class="num-key" data-key="7">7</button>
      <button class="num-key" data-key="8">8</button>
      <button class="num-key" data-key="9">9</button>
      <button class="num-key dot-key" data-key=".">.</button>
      <button class="num-key" data-key="0">0</button>
      <button class="num-key del-key" data-key="del">⌫</button>
    </div>
  </div>

  <!-- ===== HISTORY SCREEN ===== -->
  <div class="screen" id="screen-history">
    <header class="top-bar">
      <button class="icon-btn" id="btn-back" aria-label="Back">←</button>
      <div class="month-nav">
        <button class="month-arrow" id="month-prev">‹</button>
        <span id="month-label" class="month-label"></span>
        <button class="month-arrow" id="month-next">›</button>
      </div>
      <div style="width:40px"></div>
    </header>

    <div class="summary-strip">
      <div class="summary-item">
        <div class="summary-label">Spent</div>
        <div class="summary-val expense" id="sum-expense">$0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Income</div>
        <div class="summary-val income" id="sum-income">$0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Net</div>
        <div class="summary-val" id="sum-net">$0</div>
      </div>
    </div>

    <div class="cat-summary" id="cat-summary"></div>

    <div class="txn-list" id="txn-list"></div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast"></div>

  <script src="/static/script.js"></script>
</body>
</html>
